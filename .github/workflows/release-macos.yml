name: Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build (for example v1.1 or v1.0.1)
        required: true
        type: string
      publish:
        description: Publication is disabled; qualification only
        required: false
        default: false
        type: boolean
      source_ref:
        description: Candidate branch or commit to build; defaults to release tag
        required: false
        default: ""
        type: string
      replace_release:
        description: Replace existing release assets after notarization
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-and-release:
    permissions:
      contents: write
    runs-on: macos-15
    env:
      DRAWBRIDGE_VERSION_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref || inputs.release_tag) || github.ref }}

      - name: Verify checked-out candidate source
        shell: bash
        env:
          DRAWBRIDGE_EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DRAWBRIDGE_EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$actual" != "$DRAWBRIDGE_EXPECTED_SOURCE_SHA" ]]; then
            printf '%s\n' 'Checkout differs from candidate workflow SHA' >&2
            exit 1
          fi
          printf 'DRAWBRIDGE_VERIFIED_SOURCE_SHA=%s\n' "$actual"

      - name: Validate new release version
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_release }}
        run: |
          if [[ ! "$DRAWBRIDGE_VERSION_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Use v1.1 for features or v1.0.1 for fixes."
            exit 1
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName > "$RUNNER_TEMP/published-releases.json"
          python3 - "$RUNNER_TEMP/published-releases.json" <<'PYCHECK'
          import json, os, sys
          tags = {item["tagName"] for item in json.load(open(sys.argv[1]))}
          if os.environ["DRAWBRIDGE_VERSION_TAG"] in tags and os.environ.get("REPLACE_RELEASE") != "true":
              sys.exit("This release already exists. Choose a new version.")
          PYCHECK

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Check publishable files
        run: python3 Scripts/check-public-files.py

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERT_BASE64 }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID_SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_DEVELOPER_ID_CERT_BASE64}" || -z "${APPLE_DEVELOPER_ID_CERT_PASSWORD}" || -z "${APPLE_DEVELOPER_ID_SIGNING_IDENTITY}" ]]; then
            echo "Missing signing secrets (APPLE_DEVELOPER_ID_CERT_BASE64 / APPLE_DEVELOPER_ID_CERT_PASSWORD / APPLE_DEVELOPER_ID_SIGNING_IDENTITY)."
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          echo -n "$APPLE_DEVELOPER_ID_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_DEVELOPER_ID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          echo "DRAWBRIDGE_CODESIGN_IDENTITY=$APPLE_DEVELOPER_ID_SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Install PDF test helper
        run: brew install qpdf

      - name: Validate all default regression tests
        run: swift test -c release

      - name: Build app bundle
        env:
          DRAWBRIDGE_BUILD_NUMBER: "263"
          DRAWBRIDGE_SKIP_INSTALL: "1"
          DRAWBRIDGE_SKIP_CHECKPOINT: "1"
        run: ./Scripts/package-app.sh

      - name: Notarize app before packaging
        env:
          DRAWBRIDGE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          DRAWBRIDGE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          DRAWBRIDGE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: ./Scripts/notarize-release.sh dist/Drawbridge.app

      - name: Install DMG tooling
        run: brew install create-dmg

      - name: Prepare release artifacts
        run: |
          VERSION_TAG="$DRAWBRIDGE_VERSION_TAG"
          APP_NAME="Drawbridge"
          DMG_PATH="dist/${APP_NAME}-${VERSION_TAG}.dmg"
          ZIP_PATH="dist/${APP_NAME}-${VERSION_TAG}.zip"

          ./Scripts/package-dmg.sh "dist/${APP_NAME}.app" "$DMG_PATH" "$APP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP_NAME}.app" "$ZIP_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Verify installer contents and layout
        shell: bash
        run: |
          set -euo pipefail
          hdiutil verify "$DMG_PATH"
          mount_path="$RUNNER_TEMP/drawbridge-installer-check"
          mkdir -p "$mount_path"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$mount_path"
          trap 'hdiutil detach "$mount_path"' EXIT
          test -d "$mount_path/Drawbridge.app"
          test -L "$mount_path/Applications"
          test -f "$mount_path/.background/background.tiff"
          info="$(tiffutil -info "$mount_path/.background/background.tiff")"
          printf '%s\n' "$info"
          [[ "$info" == *"Resolution: 144, 144"* ]]
          tiffutil -extract 0 "$mount_path/.background/background.tiff" -out dist/installer-1x.tiff
          tiffutil -extract 1 "$mount_path/.background/background.tiff" -out dist/installer-2x.tiff
          sips -g dpiWidth -g dpiHeight dist/installer-2x.tiff
          python3 -c 'import subprocess; s=subprocess.check_output(["sips","-g","dpiWidth","-g","dpiHeight","dist/installer-2x.tiff"],text=True); assert "dpiWidth: 144.000" in s and "dpiHeight: 144.000" in s, s'
          [[ "$(sips -g pixelWidth -g pixelHeight dist/installer-1x.tiff)" == *"pixelWidth: 860"*"pixelHeight: 520"* ]]
          [[ "$(sips -g pixelWidth -g pixelHeight dist/installer-2x.tiff)" == *"pixelWidth: 1720"*"pixelHeight: 1040"* ]]
          sips -s format png dist/installer-2x.tiff --out dist/installer-preview@2x.png

      - name: Notarize DMG
        env:
          DRAWBRIDGE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          DRAWBRIDGE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          DRAWBRIDGE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
        run: |
          if [[ -z "${DRAWBRIDGE_NOTARY_APPLE_ID}" || -z "${DRAWBRIDGE_NOTARY_TEAM_ID}" || -z "${DRAWBRIDGE_NOTARY_APP_PASSWORD}" ]]; then
            echo "Missing notarization secrets (APPLE_NOTARY_APPLE_ID / APPLE_NOTARY_TEAM_ID / APPLE_NOTARY_APP_PASSWORD)."
            exit 1
          fi
          xcrun notarytool submit "${DMG_PATH}" --apple-id "$DRAWBRIDGE_NOTARY_APPLE_ID" --team-id "$DRAWBRIDGE_NOTARY_TEAM_ID" --password "$DRAWBRIDGE_NOTARY_APP_PASSWORD" --wait
          for attempt in 1 2 3 4 5; do
            if xcrun stapler staple "${DMG_PATH}"; then break; fi
            if [[ "$attempt" == 5 ]]; then exit 1; fi
            sleep 10
          done
          xcrun stapler validate "${DMG_PATH}"

      - name: Rebuild ZIP from stapled app
        run: |
          VERSION_TAG="$DRAWBRIDGE_VERSION_TAG"
          APP_NAME="Drawbridge"
          ZIP_PATH="dist/${APP_NAME}-${VERSION_TAG}.zip"
          rm -f "$ZIP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP_NAME}.app" "$ZIP_PATH"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drawbridge-macos-${{ env.DRAWBRIDGE_VERSION_TAG }}
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}
            dist/installer-preview@2x.png

      - name: Publish GitHub Release
        if: false
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.DMG_PATH }}
            ${{ env.ZIP_PATH }}

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
